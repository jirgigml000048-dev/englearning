name: Build Android APK

# 用法:
#  1. 上 GitHub 仓库 Actions → Build Android APK → Run workflow
#  2. 等 5-10 分钟构建完成
#  3. 进 Releases 页面下载最新 APK
#  4. 把 APK 传到 OPPO Pad → 打开安装 (需要在系统设置允许"未知来源安装")
#
# 离线工作: APK 把所有 HTML/CSS/JS/audio 都打包进去, 装完不需要任何网络

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'audio/**'
      - 'assets/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'capacitor.config.json'
      - 'scripts/prepare-webdir.mjs'
      - 'package.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show env
        run: |
          set -e
          echo "Node:" && node --version
          echo "npm:"  && npm --version
          echo "npx:"  && npx --version
          echo "Java:" && java -version
          echo "PWD:" && pwd && ls -la

      - name: Install npm deps (Capacitor)
        run: |
          set -e
          npm install --no-audit --no-fund --no-progress
          echo "--- node_modules/.bin ---"
          ls -la node_modules/.bin | grep -E "cap|capacitor" || true

      - name: Prepare webDir (copy html/css/js/audio → dist/)
        run: |
          set -e
          node scripts/prepare-webdir.mjs
          echo "--- dist/ ---"
          ls -la dist/ | head -20

      - name: Audio status
        run: |
          if [ -d audio ] && [ "$(ls audio/words 2>/dev/null | wc -l)" -gt "0" ]; then
            echo "✓ Audio mp3s found ($(find audio -name '*.mp3' | wc -l) files)"
          else
            echo "::warning::audio/ 文件夹为空或缺失。APK 里不会有 ElevenLabs 真人发音。"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap6-v1

      - name: Add Android platform (fail loudly if it errors)
        run: |
          set -e
          if [ -d "android" ]; then
            echo "android/ already exists, skip cap add"
          else
            npx cap add android
          fi
          echo "--- android/ contents ---"
          ls -la android/
          echo "--- android/app exists? ---"
          test -d android/app && echo "yes" || (echo "android/app MISSING" && exit 1)
          echo "--- gradlew exists? ---"
          test -f android/gradlew && echo "yes" || (echo "gradlew MISSING" && exit 1)

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Patch AndroidManifest.xml (add mic permission)
        run: node scripts/patch-android-manifest.mjs

      - name: Sync web assets to Android
        run: |
          set -e
          npx cap sync android
          echo "--- assets/public ---"
          ls -la android/app/src/main/assets/public/ | head -10

      - name: Build APK
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace

      - name: Verify APK exists
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f $APK && echo "✓ APK at $APK ($(stat -c%s $APK) bytes)" || (echo "APK MISSING" && exit 1)

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk english-trainer-v1.${GITHUB_RUN_NUMBER}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-trainer-apk-${{ github.run_number }}
          path: english-trainer-v1.*.apk
          retention-days: 30

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 📱 Android APK · build ${{ github.run_number }}
          body: |
            **英语训练师 Android 版** (调试版本, 离线可用)

            装到 OPPO Pad 4 步骤:
            1. 下载下面的 .apk 文件
            2. 把 APK 传到 Pad (微信/QQ/邮件/拷贝)
            3. Pad 打开 APK, 系统提示"未知来源" → 允许 → 安装
            4. 装完点开图标, 全程不需要网络
          files: english-trainer-v1.*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
