<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#142340" />
  <title>英语训练师 · 方块世界版</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+SC:wght@500;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="vox-app palette-grass">
    <!-- 像素天空背景 -->
    <div class="vox-sky" aria-hidden="true">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="sun"></div>
      <div class="hills"></div>
      <div class="ground"></div>
    </div>

    <!-- HUD 顶栏 -->
    <header class="vox-topbar">
      <button class="vox-avatar block-btn" id="avatarBtn" title="主页">
        <span class="avatar-face" id="avatarFace">🧒</span>
        <span class="avatar-lvl">Lv.<span id="statLevel">1</span></span>
      </button>
      <div class="vox-hud">
        <div class="hud-row" id="hearts"></div>
        <div class="hud-row" id="foods"></div>
        <div class="xp-row">
          <div class="xp-bar">
            <div class="xp-fill" id="xpFill"></div>
            <div class="xp-text" id="xpText">0 / 100 XP</div>
          </div>
          <div class="streak-pill">🔥 <span id="statStreak">0</span></div>
        </div>
      </div>
      <button class="block-btn settings-btn" id="settingsBtn" title="设置">
        <span style="font-size:24px">⚙</span>
      </button>
    </header>

    <main class="vox-main">
      <!-- 主页 -->
      <section class="view view-home vox-home" id="viewHome">
        <div class="hero-banner">
          <div class="hero-mascot">
            <div class="mascot-body">
              <div class="mascot-pixel mascot-pig"></div>
            </div>
            <div class="mascot-shadow"></div>
          </div>
          <div class="hero-text">
            <div class="hero-eyebrow">DAILY QUEST · 今日任务</div>
            <h1 class="hero-title">准备好了吗，<span class="accent" id="trainerName">小训练师</span>？</h1>
            <p class="hero-sub" id="missionSummary">完成 4 关 · 约 45 分钟 · 解锁今日成就</p>
            <div class="hero-meta">
              <span id="metaDate">⛏ 方块世界 · 今日</span>
              <span id="metaStreak">⏱ 累计 0 天</span>
            </div>
          </div>
        </div>

        <div class="quests-grid" id="questsGrid">
          <!-- 由 app.js 渲染 -->
        </div>

        <button class="finish-btn block-btn block-gold hidden" id="finishBtn">
          🎁 打开今日宝箱 — 领取奖励
        </button>

        <div class="ach-row">
          <div class="ach-title"><span class="title-bullet">▮</span> ACHIEVEMENTS · 成就图鉴</div>
          <div class="ach-grid" id="badges"></div>
        </div>
      </section>

      <!-- 关卡面板 -->
      <section class="view view-stage hidden" id="viewStage">
        <div class="stage-panel block-stone" id="stagePanel">
          <div class="stage-header">
            <button class="block-btn back-btn" id="stageBack">← 返回</button>
            <div class="stage-title" id="stageTitle">关卡</div>
            <div class="stage-progress" id="stageProgress"></div>
          </div>
          <div class="stage-body" id="stageBody"></div>
          <div class="stage-actions" id="stageFooter"></div>
        </div>
      </section>

      <!-- 完成页 -->
      <section class="view view-done hidden" id="viewDone">
        <div class="done-stage">
          <div class="chest">
            <div class="chest-lid"></div>
            <div class="chest-body"></div>
            <div class="chest-glow"></div>
            <div class="chest-stars"><span style="--d:0s">✦</span><span style="--d:0.3s">✦</span><span style="--d:0.6s">✦</span></div>
          </div>
          <h1 class="done-title">今日训练完成！</h1>
          <p class="done-sub" id="doneSub">+1 连击 · 解锁今日成就</p>
          <div class="loot-grid">
            <div class="loot-item"><div class="loot-num" id="doneNewWords">0</div><div class="loot-label">新词获得</div></div>
            <div class="loot-item"><div class="loot-num" id="doneAccuracy">0%</div><div class="loot-label">阅读准确率</div></div>
            <div class="loot-item"><div class="loot-num" id="doneXp">+0</div><div class="loot-label">经验值</div></div>
            <div class="loot-item"><div class="loot-num" id="doneStar">★</div><div class="loot-label">满分时刻</div></div>
          </div>
          <div class="done-quote" id="doneMessage">"你今天比昨天又厉害了一点！"</div>
          <button class="block-btn primary big" id="doneBackBtn">回到主页</button>
        </div>
      </section>

      <!-- 设置 -->
      <section class="view view-settings hidden" id="viewSettings">
        <div class="stage-panel block-stone">
          <div class="stage-header">
            <button class="block-btn back-btn" id="settingsBack">← 返回</button>
            <div class="stage-title">⚙ 设置 · OPTIONS</div>
            <div></div>
          </div>
          <div class="stage-body">
            <div class="settings-list">
              <div class="set-row">
                <label>训练师名字</label>
                <input class="vox-input" id="setName" placeholder="小训练师" />
              </div>
              <div class="set-row">
                <label>头像</label>
                <div class="avatar-row" id="avatarPicker"></div>
              </div>
              <div class="set-row">
                <label>当前学习单元</label>
                <select class="vox-input" id="setUnit"></select>
              </div>
              <div class="set-row">
                <label>每日目标（分钟）</label>
                <input class="vox-input" type="number" id="setMinutes" min="15" max="90" step="5" />
              </div>
              <div class="set-row">
                <label>朗读语速</label>
                <input type="range" id="setRate" min="0.6" max="1.2" step="0.1" />
                <span id="setRateVal" style="font-family:var(--font-pixel);font-size:11px;color:var(--gold-lt);">0.9</span>
              </div>
              <div class="set-row">
                <label>家长报告</label>
                <button class="block-btn ghost" id="reportBtn">查看本周报告 →</button>
              </div>
              <div class="set-row danger">
                <label>清空进度</label>
                <button class="block-btn danger" id="resetBtn">清空</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部 hotbar -->
    <nav class="hotbar" id="hotbar"></nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/modules/warmup.js"></script>
  <script src="js/modules/words.js"></script>
  <script src="js/modules/reading.js"></script>
  <script src="js/modules/fun.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
